<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDRIC STORE | Cloud Phone & Gaming Services</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0e12;
      color: #e1e3e6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .mobile-container {
      width: 100%;
      max-width: 480px;
      background-color: #111217;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid #22252e;
      border-right: 1px solid #22252e;
      padding-bottom: 40px;
    }
    .header {
      background-color: #16181f;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #22252e;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-box {
      background: #f5c400;
      color: #111217;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .content {
      padding: 16px;
      flex: 1;
    }
    .banner-announcement {
      background: rgba(245, 196, 0, 0.1);
      border: 1px solid rgba(245, 196, 0, 0.3);
      color: #f5c400;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #8a919e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      margin-top: 20px;
    }
    .card {
      background: #16181f;
      border: 1px solid #22252e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .service-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .service-desc {
      font-size: 13px;
      color: #9ba1ad;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .price-tag {
      color: #f5c400;
      font-weight: 800;
      font-size: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0084ff;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #006dd6;
    }
